[package]
name = "mail-mcp"
version = "0.4.5"
edition = "2024"
license = "MIT"
description = "Secure IMAP MCP server over stdio with cursor-based pagination, multi-account support, and TLS-only connections"
repository = "https://github.com/tecnologicachile/mail-mcp"
readme = "README.md"
keywords = ["mcp", "imap", "email", "mail", "protocol"]
categories = ["email", "api-bindings"]

[dependencies]
ammonia = "4.1.2"
arc-swap = "1.7.1"
argon2 = "0.5.3"
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
axum = { version = "0.7.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std", "serde"] }
dotenvy = "0.15.7"
futures = "0.3.31"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }
mailparse = "0.16.1"
mime_guess = "2.0.5"
pdf-extract = "0.10.0"
quick-xml = "0.36"
rand = "0.8.5"
regex = "1.12.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { version = "0.16.0", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rust-embed = { version = "8.5.0", features = ["debug-embed"] }
rustls = "0.23.32"
rustls-pki-types = "1.12.0"
schemars = "1.0.4"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "io-std", "time", "sync", "signal"] }
tokio-rustls = "0.26.2"
tower-http = { version = "0.6.2", default-features = false, features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
uuid = { version = "1.18.1", features = ["v4"] }
webpki-roots = "1.0.2"
urlencoding = "2.1.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
